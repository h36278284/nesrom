name: export-games-only

on:
  push:
    paths:
      - '.export-games-only-trigger'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed baseline
        uses: actions/checkout@v4
        with:
          ref: 8f7abad7996f8ec98c798dee5b69456603a82dd0
          fetch-depth: 1

      - name: Build games-only manifest and six independent ZIP volumes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, csv, zipfile

          allowed = {'.nes', '.fds', '.unf', '.unif'}
          files = sorted(
              p for p in Path('.').rglob('*')
              if p.is_file()
              and '.git' not in p.parts
              and p.suffix.lower() in allowed
          )
          total = sum(p.stat().st_size for p in files)

          with open('nesrom_games_manifest.csv', 'w', newline='', encoding='utf-8-sig') as fh:
              w = csv.writer(fh)
              w.writerow(['path', 'size_bytes', 'sha256'])
              for p in files:
                  h = hashlib.sha256()
                  with p.open('rb') as src:
                      for chunk in iter(lambda: src.read(1024 * 1024), b''):
                          h.update(chunk)
                  w.writerow([p.as_posix(), p.stat().st_size, h.hexdigest()])

          # Greedy size balancing into exactly 6 independent ZIP files.
          bins = [[] for _ in range(6)]
          sizes = [0] * 6
          for p in sorted(files, key=lambda x: x.stat().st_size, reverse=True):
              i = min(range(6), key=lambda j: sizes[j])
              bins[i].append(p)
              sizes[i] += p.stat().st_size

          out = Path('chunks')
          out.mkdir()
          for i, members in enumerate(bins, 1):
              zpath = out / f'nesrom_games_8f7abad_part{i:02d}_of_06.zip'
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as z:
                  for p in sorted(members):
                      z.write(p, arcname=p.as_posix())
              print(f'PART_{i:02d}_FILES={len(members)}')
              print(f'PART_{i:02d}_RAW_BYTES={sizes[i]}')
              print(f'PART_{i:02d}_ZIP_BYTES={zpath.stat().st_size}')

          print(f'GAME_FILE_COUNT={len(files)}')
          print(f'GAME_TOTAL_BYTES={total}')
          print('Included extensions: .nes/.fds/.unf/.unif (case-insensitive)')
          print('Non-ROM files such as emulator APK/EXE/DLL/config are excluded.')
          PY

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: nesrom-games-part01-8f7abad
          path: chunks/nesrom_games_8f7abad_part01_of_06.zip
          compression-level: 0
          retention-days: 7
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: nesrom-games-part02-8f7abad
          path: chunks/nesrom_games_8f7abad_part02_of_06.zip
          compression-level: 0
          retention-days: 7
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: nesrom-games-part03-8f7abad
          path: chunks/nesrom_games_8f7abad_part03_of_06.zip
          compression-level: 0
          retention-days: 7
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: nesrom-games-part04-8f7abad
          path: chunks/nesrom_games_8f7abad_part04_of_06.zip
          compression-level: 0
          retention-days: 7
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: nesrom-games-part05-8f7abad
          path: chunks/nesrom_games_8f7abad_part05_of_06.zip
          compression-level: 0
          retention-days: 7
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: nesrom-games-part06-8f7abad
          path: chunks/nesrom_games_8f7abad_part06_of_06.zip
          compression-level: 0
          retention-days: 7

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: nesrom-games-manifest-8f7abad
          path: nesrom_games_manifest.csv
          compression-level: 9
          retention-days: 7
