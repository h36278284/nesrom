name: export-games-only

on:
  push:
    paths:
      - '.export-games-only-trigger'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed baseline
        uses: actions/checkout@v4
        with:
          ref: 8f7abad7996f8ec98c798dee5b69456603a82dd0
          fetch-depth: 1

      - name: Collect NES/FDS game ROMs only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          find . -type f \
            \( -iname '*.nes' -o -iname '*.fds' -o -iname '*.unf' -o -iname '*.unif' \) \
            -not -path './.git/*' -print0 | \
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            mkdir -p "export/$(dirname "$rel")"
            cp -- "$f" "export/$rel"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, csv

          root = Path('export')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          total = sum(p.stat().st_size for p in files)
          with open('nesrom_games_manifest.csv', 'w', newline='', encoding='utf-8-sig') as fh:
              w = csv.writer(fh)
              w.writerow(['path', 'size_bytes', 'sha256'])
              for p in files:
                  h = hashlib.sha256()
                  with p.open('rb') as src:
                      for chunk in iter(lambda: src.read(1024 * 1024), b''):
                          h.update(chunk)
                  w.writerow([p.relative_to(root).as_posix(), p.stat().st_size, h.hexdigest()])
          print(f'GAME_FILE_COUNT={len(files)}')
          print(f'GAME_TOTAL_BYTES={total}')
          print('Included extensions: .nes/.fds/.unf/.unif (case-insensitive)')
          print('Non-ROM files such as emulator APK/EXE/DLL/config are excluded.')
          PY

      - name: Upload games-only archive
        uses: actions/upload-artifact@v4
        with:
          name: nesrom-games-only-8f7abad
          path: export/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: nesrom-games-manifest-8f7abad
          path: nesrom_games_manifest.csv
          compression-level: 9
          if-no-files-found: error
          retention-days: 7
